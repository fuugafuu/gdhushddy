<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>通信速度測定（簡易版）</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
    }
    #result {
      margin-top: 30px;
      font-size: 1.5em;
    }
  </style>
</head>
<body>

<h1>通信速度測定（簡易版）</h1>
<button id="startBtn">測定開始</button>
<div id="result"></div>

<script>
  document.getElementById("startBtn").addEventListener("click", async () => {
    const resultDiv = document.getElementById("result");
    resultDiv.textContent = "測定中...";

    // 適当なダミーデータを用意（メモリ上で）
    const blob = new Blob([new ArrayBuffer(5 * 1024 * 1024)]); // 5MBのデータ
    const url = URL.createObjectURL(blob);

    const startTime = performance.now();
    try {
      const response = await fetch(url);
      const data = await response.blob(); // 受け取る
      const endTime = performance.now();

      const durationInSeconds = (endTime - startTime) / 1000;
      const fileSizeInBits = data.size * 8;
      const speedMbps = (fileSizeInBits / durationInSeconds / 1000000).toFixed(2);

      resultDiv.textContent = `通信速度（参考値）: ${speedMbps} Mbps`;
    } catch (error) {
      resultDiv.textContent = "測定失敗: " + error;
    } finally {
      URL.revokeObjectURL(url);
    }
  });
</script>

</body>
</html>
